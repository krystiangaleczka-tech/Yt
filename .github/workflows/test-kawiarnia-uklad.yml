name: Kawiarnia - poprawka animacji ręki
on:
  push:
    branches: [test-kawiarnia-uklad]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [klip, kontrola]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy pillow scipy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core
      - name: Render albo test
        working-directory: output/bonnie-i-clyde
        run: |
          mkdir -p /tmp/wyniki
          case "${{ matrix.task }}" in
            klip) python3 ujecie_kawiarnia.py klip /tmp/wyniki/klip_bez_dzwieku.mp4 && python3 ujecie_kawiarnia.py dzwiek /tmp/wyniki/klip_bez_dzwieku.mp4 /tmp/wyniki/kawiarnia.mp4 ;;
            kontrola) python3 ujecie_kawiarnia.py kontrola /tmp/wyniki; cat /tmp/wyniki/raport_kawiarnia.md ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.task }}
          path: /tmp/wyniki/
