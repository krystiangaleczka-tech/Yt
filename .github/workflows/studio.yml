name: DocOS Studio
on:
  push:
    paths: ['apps/studio/**', 'studio_*/**', 'scripts/studio*', 'scripts/install_studio.py', 'requirements-studio*', '.github/workflows/studio.yml']
  pull_request:
    paths: ['apps/studio/**', 'studio_*/**', 'scripts/studio*', 'scripts/install_studio.py', 'requirements-studio*', '.github/workflows/studio.yml']
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-studio.lock
      - name: Ensure FFmpeg and PDF/OCR tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v pdfinfo >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg poppler-utils tesseract-ocr
          fi
      - run: python -m pip install -r requirements-studio.lock openpyxl
      - run: npm --prefix apps/studio ci
      - run: npm run build
      - run: npm run test:frontend
      - run: npm --prefix apps/studio run remotion:setup
      - run: python -m unittest discover -s studio_tests -v
        env:
          DOCOS_TEST_REMOTION: '1'
      - run: python -m unittest discover -s docos/tests -v
