<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA Clipper</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="logo">GC</div>
    <button data-page="home"><span class="ic">⌂</span>Start</button>
    <button data-page="shorts"><span class="ic">▤</span>Shorty</button>
    <button data-page="streamers"><span class="ic">◉</span>Streamerzy</button>
    <button data-page="make"><span class="ic">✚</span>Zrób</button>
    <button data-page="ready"><span class="ic">✔</span>Gotowe</button>
    <button data-page="plan"><span class="ic">▦</span>Plan</button>
    <button data-page="look"><span class="ic">✎</span>Wygląd</button>
    <button data-page="publish"><span class="ic">⇪</span>Publikacja</button>
    <div class="grow"></div>
    <button data-page="propose"><span class="ic">✉</span>Zaproponuj<br>zmianę</button>
    <button data-page="settings"><span class="ic">⚙</span>Ustawienia</button>
  </nav>
  <main id="main"></main>
</div>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
